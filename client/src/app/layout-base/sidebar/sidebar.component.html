<aside class="sidebar" [class.active]="isSidebarOpen">
  <nav class="sidebar-nav">
    <div class="sidebar-group">
      <h3 class="sidebar-heading">Geral</h3>
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        >📊 Dashboard</a
      >
      <a routerLink="/dashboard/transacoes_analise" routerLinkActive="active"
        >📈 Análises</a
      >
      <a
        routerLink="/dashboard/transacoes_analise/create"
        routerLinkActive="active"
        >+AnálisesCreate</a
      >
    </div>

    <div class="sidebar-group">
      <h3 class="sidebar-heading">Financeiro</h3>
      <a routerLink="/dashboard/transacoes" routerLinkActive="active"
        >💸 Transações</a
      >
      <a routerLink="/dashboard/transacoes/create" routerLinkActive="active"
        >+TransaçõesCreate</a
      >
      <a routerLink="/dashboard/produtos" routerLinkActive="active"
        >🛍️ Produtos</a
      >
      <a routerLink="/dashboard/servicos" routerLinkActive="active"
        >🛠️ Serviços</a
      >
      <a routerLink="/dashboard/produtos/create" routerLinkActive="active"
        >+Prod/ServCreate</a
      >
    </div>

    <div class="sidebar-group">
      <h3 class="sidebar-heading">Conta</h3>
      <button (click)="logout()" class="logout-button">🔙 Logout</button>
    </div>
  </nav>
</aside>
