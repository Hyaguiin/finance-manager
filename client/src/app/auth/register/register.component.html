<div class="auth-wrapper">
    <div class="auth-card">
      <h2 class="auth-title">Criar conta ✨</h2>
      <p class="auth-subtitle">Preencha os dados abaixo para se registrar</p>
  
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="name">Nome</label>
          <input id="name" type="text" formControlName="name" placeholder="Seu nome" />
        </div>
  
        <div class="form-group">
          <label for="second_name">Sobrenome</label>
          <input id="second_name" type="text" formControlName="second_name" placeholder="Seu sobrenome" />
        </div>
  
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" placeholder="email@exemplo.com" />
        </div>
  
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input id="cpf" type="text" formControlName="cpf" placeholder="000.000.000-00" mask="000.000.000-00" />
        </div>
  
        <div class="form-group">
          <label for="cnpj">CNPJ (opcional)</label>
          <input id="cnpj" type="text" formControlName="cnpj" placeholder="00.000.000/0000-00" mask="00.000.000/0000-00" />
        </div>
  
        <div class="form-group">
          <label for="password">Senha</label>
          <input id="password" type="password" formControlName="password" placeholder="Sua senha" />
        </div>
  
        <button type="submit" class="auth-button" [disabled]="registerForm.invalid">Registrar</button>
      </form>
  
      <p class="auth-footer">
        Já tem uma conta?
        <a routerLink="/login">Entrar</a>
      </p>
    </div>
  </div>
