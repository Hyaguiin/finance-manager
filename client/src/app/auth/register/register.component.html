<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="auth-logo">GLRMH</h1>
    <h2 class="auth-title">Criar conta ✨</h2>
    <p class="auth-subtitle">Preencha os dados abaixo para se registrar</p>

    <form
      [formGroup]="registerForm"
      (ngSubmit)="onSubmit()"
      class="auth-form"
      novalidate
    >
      <div class="form-group">
        <label for="name">Nome</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="Seu nome"
        />
        <small
          *ngIf="
            registerForm.get('name')?.invalid &&
            registerForm.get('name')?.touched
          "
          class="error-text"
        >
          Nome é obrigatório
        </small>
      </div>

      <div class="form-group">
        <label for="second_name">Sobrenome</label>
        <input
          id="second_name"
          type="text"
          formControlName="second_name"
          placeholder="Seu sobrenome"
        />
        <small
          *ngIf="
            registerForm.get('second_name')?.invalid &&
            registerForm.get('second_name')?.touched
          "
          class="error-text"
        >
          Sobrenome é obrigatório
        </small>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="email@exemplo.com"
        />
        <small
          *ngIf="
            registerForm.get('email')?.invalid &&
            registerForm.get('email')?.touched
          "
          class="error-text"
        >
          Email inválido
        </small>
      </div>

      <div class="form-group">
        <label for="cpf">CPF</label>
        <input
          id="cpf"
          type="text"
          formControlName="cpf"
          placeholder="000.000.000-00"
          mask="000.000.000-00"
        />
        <small
          *ngIf="
            registerForm.get('cpf')?.invalid && registerForm.get('cpf')?.touched
          "
          class="error-text"
        >
          CPF é obrigatório
        </small>
      </div>

      <div class="form-group">
        <label for="cnpj">CNPJ (opcional)</label>
        <input
          id="cnpj"
          type="text"
          formControlName="cnpj"
          placeholder="00.000.000/0000-00"
          mask="00.000.000/0000-00"
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Sua senha"
        />
        <small
          *ngIf="
            registerForm.get('password')?.invalid &&
            registerForm.get('password')?.touched
          "
          class="error-text"
        >
          Senha mínima 6 caracteres
        </small>
      </div>

      <button
        type="submit"
        class="auth-button"
        [disabled]="registerForm.invalid"
      >
        Registrar
      </button>
    </form>

    <p class="auth-footer">
      Já tem uma conta?
      <a routerLink="/auth/login">Entrar</a>
    </p>
  </div>
</div>
