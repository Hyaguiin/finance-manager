<div class="transactions-container">
  <h2>Lista de Produtos</h2>

  <ul *ngIf="products.length > 0">
    <li *ngFor="let product of products" class="credit">
      <div class="desc">{{ product.name }}</div>
      <div class="category">Produto</div>
      <div class="amount">R$ {{ +product.price | number:'1.2-2' }}</div>
      <div class="date">{{ product.description }}</div>
      <button (click)="deleteProduct(product.id!)">🗑️ Excluir</button>
    </li>
  </ul>

  <div class="empty" *ngIf="products.length === 0">
    Nenhum produto encontrado.
  </div>
</div>
